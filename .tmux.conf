# Terminal and mouse support
set -g mouse on
set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ',xterm-ghostty:RGB'
# set -ga terminal-overrides ',xterm-ghostty:RGB:Ss=\E[%p1%d q:Se=\E[ q'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# -- TPM plugins --
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin 'tmux-plugins/tmux-git-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin "tmux-plugins/tpm"

# --- Catppuccin Mocha ---
# Installed outside TPM: its repo is also named "tmux", which clashes with
# the old rose-pine folder in ~/.tmux/plugins/tmux.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg=default]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@thm_peach},bg=default]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_surface_1},bg=default]"
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_blue},bg=default]"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, (zoom),}"
set -g @catppuccin_window_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_directory_color "#{E:@thm_pink}"
set -g @catppuccin_status_background "none"
set -g @catppuccin_status_connect_separator "no"
run "~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_directory}"
set -g window-status-separator " "

# Blank line under the bar as bottom padding
set -g status 2
set -g status-format[1] ""

# --- Session switcher popup (prefix u) ---
set -g @sessionx-bind 'u'
set -g @sessionx-filter-current 'false'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-layout 'reverse'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '80%'
set -g @sessionx-additional-options "--color=bg+:#313244,fg:#cdd6f4,fg+:#cdd6f4,hl:#f38ba8,hl+:#f38ba8,info:#cba6f7,prompt:#b4befe,pointer:#89b4fa,marker:#a6e3a1,header:#a6adc8,border:#45475a"

run "~/.tmux/plugins/tpm/tpm"

# --- Setup ---

# Use Ctrl-s as prefix instead of default Ctrl-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Set escape-time to 0 for snappy vim/tmux experience
set-option -s escape-time 0

# Enable vi-style keys in copy mode (use `v`, `y`, `hjkl`, etc.)
set -g mode-keys vi
set -g renumber-windows on

# Start visual selection with 'v'
bind-key -T copy-mode-vi v send -X begin-selection

# Yank to system clipboard using pbcopy (macOS only)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# Enable focus events (useful for Vim/Neovim autocommands)
set-option -s focus-events on

# Enable extended keys
set-option -s extended-keys on

# Pane naming
set-option -g base-index 1
set-option -g pane-base-index 1

# Move window to lowest available index
set -g set-titles off
set -g set-titles-string ""

bind R move-window -r
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -p 30 -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Window/session lists (prefix w / prefix s): styled rows, no hostname pane title.
# Claude Code's process is named after its version, so show those windows as "claude".
set -g @tree_name '#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{window_name}},claude,#{window_name}}'
set -g @tree_session '#[fg=#b4befe]#{session_windows} window#{?#{==:#{session_windows},1},,s}#{?session_attached,  #[fg=#a6e3a1]attached,}'
set -g @tree_window '#{?window_active,#[fg=#89b4fa]#[bold],#[fg=#cdd6f4]}#{E:@tree_name}#[default]  #[fg=#9399b2]#{b:pane_current_path}#{?window_active,  #[fg=#a6e3a1]●,}'
set -g @tree_pane '#[fg=#a6adc8]#{pane_current_command}#{?pane_active, #[fg=#a6e3a1]●,}'
set -g @tree_format '#{?pane_format,#{E:@tree_pane},#{?window_format,#{E:@tree_window},#{E:@tree_session}}}'
bind w choose-tree -Zw -F '#{E:@tree_format}'
bind s choose-tree -Zs -F '#{E:@tree_format}'

# Resize horizontally
bind = resize-pane -R 5
bind _ resize-pane -L 5

# Resize vertically
bind + resize-pane -U 2
bind - resize-pane -D 2

# Option+number jumps straight to a window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5

